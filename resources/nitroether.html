<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Chemistry: Ethers & Nitro Compounds</title>
    <style>
        /* Modernized "Old Method" Layout */
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            margin: 2rem auto;
            border: 1px solid var(--border-color);
        }

        .mode-selection {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .flashcard-container {
            width: 100%;
            height: 350px;
            perspective: 1000px;
            margin-bottom: 2rem;
        }

        .flashcard-inner {
            position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; border-radius: var(--border-radius); background-color: var(--card-bg);
            box-shadow: var(--shadow-md); border: 1px solid var(--border-color);
        }
        .flashcard-back {
            transform: rotateY(180deg); background-color: var(--light-bg);
            align-items: flex-start; text-align: left;
        }

        .option-button {
            display: block; width: 100%; text-align: left; padding: 1.2rem; margin-bottom: 1rem;
            border: 1px solid var(--border-color); border-radius: var(--border-radius);
            background-color: var(--card-bg); color: var(--text-primary); cursor: pointer; transition: var(--transition);
        }
        .option-button:hover:not(:disabled) { background-color: var(--light-bg); transform: translateX(5px); }
        
        .correct-option { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .incorrect-option { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        .feedback-explanation {
            margin-top: 1.5rem; padding: 1.5rem; background-color: var(--light-bg);
            border-radius: var(--border-radius); border-left: 5px solid var(--primary-color);
        }

        .hidden { display: none !important; }
        .flex-center { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="../index.html" class="card-btn" style="background-color: transparent; border: 1px solid white;">← Back to Home</a>
            <button id="themeToggle" class="theme-toggle" style="margin-left: auto;">🌙</button>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="section-title" style="text-align: center; margin-bottom: 0.5rem;">Chemistry Review</h1>
        <h2 style="text-align: center; font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2rem;">Ethers & Organometallic Compounds</h2>

        <!-- Mode Selection Area -->
        <div id="mode-selection" class="mode-selection">
            <button id="mcq-select" onclick="selectMode('mcq')" class="btn" style="background-color: #3b82f6;">MCQ Quiz</button>
            <button id="flash-select" onclick="selectMode('flashcard')" class="btn" style="background-color: #10b981;">Flashcards</button>
        </div>

        <div id="content-area" class="hidden">
            <div id="topic-indicator" style="text-align: center; font-weight: 600; color: var(--primary-color); margin-bottom: 1.5rem;"></div>

            <!-- MCQ View -->
            <div id="mcq-mode" class="hidden">
                <div id="mcq-question" style="font-size: 1.1rem; font-weight: 500; margin-bottom: 1.5rem; padding: 1.5rem; background-color: var(--light-bg); border-radius: var(--border-radius);"></div>
                <div id="mcq-options"></div>
                <div id="mcq-feedback" class="feedback-explanation hidden" style="margin-bottom: 1rem;"></div>
                <div id="mcq-explanation" class="feedback-explanation hidden">
                    <strong style="color: var(--primary-color);">Explanation:</strong> <span id="explanation-text"></span>
                </div>
            </div>

            <!-- Flashcard View -->
            <div id="flashcard-mode" class="hidden flex-center">
                 <div class="flashcard-container flashcard cursor-pointer" onclick="flipCard(this)">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <p id="flashcard-question" style="font-size: 1.2rem; font-weight: 500;"></p>
                            <span style="font-size: 0.8rem; color: #94a3b8; margin-top: 2.5rem;">(Click to flip)</span>
                        </div>
                        <div class="flashcard-back">
                             <p id="flashcard-answer" style="font-weight: 700; color: var(--primary-color); margin-bottom: 0.5rem;"></p>
                             <p id="flashcard-explanation" style="font-size: 0.95rem; line-height: 1.6;"></p>
                        </div>
                    </div>
                </div>
                <button id="flip-btn" onclick="flipCard(document.querySelector('.flashcard'))" class="btn" style="background-color: #f59e0b;">Reveal Answer</button>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
                 <button id="next-btn" class="btn" style="min-width: 150px;">Next →</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "General formula for aliphatic ethers?", options: ["R-CO-R", "R-O-R", "R-OH", "R-CHO"], answer: "R-O-R", explanation: "Ethers are compounds where two alkyl or aryl groups are bonded to an oxygen atom." },
            { question: "Dimethyl ether and Ethanol are:", options: ["Position isomers", "Functional isomers", "Metamers", "Chain isomers"], answer: "Functional isomers", explanation: "They share the same formula (C2H6O) but have different functional groups (ether vs alcohol)." },
            { question: "Williamson's synthesis involves reacting an alkyl halide with:", options: ["Zinc dust", "Sodium alkoxide", "Silver oxide", "Ammonia"], answer: "Sodium alkoxide", explanation: "It's an SN2 reaction where an alkoxide ion attacks an alkyl halide to form an ether." },
            { question: "Common name for Ethoxyethane?", options: ["Methyl ethyl ether", "Diethyl ether", "Dipropyl ether", "Ethyl acetate"], answer: "Diethyl ether", explanation: "Ethoxyethane consists of two ethyl groups connected by oxygen." },
            { question: "Reaction: C2H5I + Ag2O (dry) -> ?", options: ["Ethanol", "Diethyl ether", "Ethane", "Ethanal"], answer: "Diethyl ether", explanation: "Dry silver oxide reacts with alkyl halides to form symmetrical ethers." },
            { question: "Reaction: C2H5I + Ag2O (moist) -> ?", options: ["Ethanol", "Diethyl ether", "Ethane", "Ethanal"], answer: "Ethanol", explanation: "Moist Ag2O acts as AgOH, which converts alkyl halides to alcohols." },
            { question: "Which produces Ethyl iodide and Ethanol when treated with HI?", options: ["Diethyl ether", "Dimethyl ether", "Anisole", "Toluene"], answer: "Diethyl ether", explanation: "Reaction: C2H5OC2H5 + HI -> C2H5I + C2H5OH." },
            { question: "Reducing agent used in Mendius reaction (RCN -> RCH2NH2)?", options: ["LiAlH4", "Na / Ethanol", "Zn / HCl", "H2 / Ni"], answer: "Na / Ethanol", explanation: "Mendius reaction specifically uses nascent hydrogen from sodium and ethanol to reduce nitriles to primary amines." },
            { question: "Nitrobenzene is reduced to Aniline using:", options: ["Sn / HCl", "Na / Ethanol", "LiAlH4", "H2O2"], answer: "Sn / HCl", explanation: "Tin and concentrated Hydrochloric acid is the standard laboratory reagent for reducing nitro groups on benzene rings." }
        ];

        let mode = null;
        let index = 0;
        let score = 0;
        let shuffled = [];

        function selectMode(m) {
            mode = m;
            index = 0;
            score = 0;
            shuffled = [...quizData].sort(() => Math.random() - 0.5);
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('content-area').classList.remove('hidden');
            load();
        }

        function load() {
            if (index >= shuffled.length) {
                finish();
                return;
            }
            const q = shuffled[index];
            document.getElementById('topic-indicator').textContent = `${mode === 'mcq' ? 'Question' : 'Card'} ${index + 1} of ${shuffled.length}`;
            document.getElementById('next-btn').disabled = (mode === 'mcq');
            document.getElementById('next-btn').textContent = (index === shuffled.length - 1) ? 'Finish' : 'Next →';

            if (mode === 'mcq') {
                document.getElementById('mcq-mode').classList.remove('hidden');
                document.getElementById('flashcard-mode').classList.add('hidden');
                document.getElementById('mcq-question').textContent = q.question;
                const container = document.getElementById('mcq-options');
                container.innerHTML = '';
                document.getElementById('mcq-feedback').classList.add('hidden');
                document.getElementById('mcq-explanation').classList.add('hidden');
                
                const opts = [...q.options].sort(() => Math.random() - 0.5);
                opts.forEach(o => {
                    const btn = document.createElement('button');
                    btn.className = 'option-button';
                    btn.textContent = o;
                    btn.onclick = () => check(o, btn);
                    container.appendChild(btn);
                });
            } else {
                document.getElementById('mcq-mode').classList.add('hidden');
                document.getElementById('flashcard-mode').classList.remove('hidden');
                document.getElementById('flashcard-question').textContent = q.question;
                document.getElementById('flashcard-answer').textContent = q.answer;
                document.getElementById('flashcard-explanation').textContent = q.explanation;
                document.querySelector('.flashcard').classList.remove('flipped');
            }
        }

        function check(val, btn) {
            const q = shuffled[index];
            const correct = val === q.answer;
            const buttons = document.querySelectorAll('.option-button');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.textContent === q.answer) b.classList.add('correct-option');
                else if (b.textContent === val) b.classList.add('incorrect-option');
            });

            const feed = document.getElementById('mcq-feedback');
            feed.classList.remove('hidden');
            feed.textContent = correct ? "Correct!" : "Incorrect.";
            feed.style.color = correct ? "#10b981" : "#ef4444";
            document.getElementById('explanation-text').textContent = q.explanation;
            document.getElementById('mcq-explanation').classList.remove('hidden');
            
            if (correct) score++;
            document.getElementById('next-btn').disabled = false;
        }

        function finish() {
            document.getElementById('content-area').classList.add('hidden');
            const res = document.createElement('div');
            res.className = 'flex-center';
            res.innerHTML = `
                <h2 class="section-title">Review Complete!</h2>
                <p style="margin: 1.5rem 0; font-size: 1.1rem;">${mode === 'mcq' ? `Your Final Score: ${score} / ${shuffled.length}` : 'You have reviewed all flashcards.'}</p>
                <button onclick="location.reload()" class="btn">Restart Study Session</button>
            `;
            document.querySelector('.main-container').appendChild(res);
        }

        function flipCard(el) { el.classList.toggle('flipped'); }

        document.getElementById('next-btn').onclick = () => {
            index++;
            load();
        };
    </script>
    <script src="../js/main.js"></script>
</body>
</html>
